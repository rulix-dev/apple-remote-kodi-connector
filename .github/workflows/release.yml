name: release

# Builds the binaries and attaches them to the GitHub release of a tag.
# Triggered by pushing a tag like v1.2.3 (also when the release is created from
# the GitHub UI), or manually for an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v1.2.3)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: build archives
        run: |
          set -euo pipefail
          name=apple-remote-kodi-connector
          tag=$TAG
          mkdir dist
          for arch in amd64 arm64; do
            pkg=$name-$tag-linux-$arch
            mkdir -p "dist/$pkg/bin"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$tag" -o "dist/$pkg/bin/$name" ./cmd/$name
            cp -r install.sh uninstall.sh packaging configs README.md LICENSE "dist/$pkg/"
            tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS && cat SHA256SUMS)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist (created from the GitHub UI).
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --title "$TAG" --generate-notes
          fi

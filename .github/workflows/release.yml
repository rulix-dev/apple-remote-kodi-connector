name: release

# Push a tag like v1.2.3 to build the binaries and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: build archives
        run: |
          set -euo pipefail
          name=apple-remote-kodi-connector
          tag=$GITHUB_REF_NAME
          mkdir dist
          for arch in amd64 arm64; do
            pkg=$name-$tag-linux-$arch
            mkdir -p "dist/$pkg/bin"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$tag" -o "dist/$pkg/bin/$name" ./cmd/$name
            cp -r install.sh uninstall.sh packaging configs README.md LICENSE "dist/$pkg/"
            tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS && cat SHA256SUMS)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
